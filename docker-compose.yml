version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: hospitrix_db
    restart: always
    environment:
      POSTGRES_USER: hospitrix
      POSTGRES_PASSWORD: hospitrix_password
      POSTGRES_DB: hospitrix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Backend API
  api:
    build: .
    container_name: hospitrix_api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://hospitrix:hospitrix_password@db:5432/hospitrix
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "5000:5000"

volumes:
  postgres_data:
